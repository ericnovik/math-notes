    - part: "Phase 2 — Real Analysis (Abbott)"
      chapters:
        - real-analysis/index.qmd
    - part: "Phase 3 — Measure-Theoretic Probability (Rosenthal)"
      chapters:
        - measure-theory/index.qmd
    - part: "Parallel — Complex Analysis (Needham)"
      chapters:
        - complex-analysis/index.qmd
    - part: "Parallel — Nonlinear Dynamics (Strogatz)"
      chapters:
        - nonlinear-dynamics/index.qmd
    - part: "Parallel — Estimation (Mahajan)"
      chapters:
        - estimation/index.qmd

